apiVersion: platform.stackrox.io/v1alpha1
kind: Central
metadata:
  name: stackrox-central-services
  namespace: stackrox
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  central:
    exposure:
      route:
        enabled: true
        host: acs.CLUSTER_SUBDOMAIN_PLACEHOLDER
    nodeSelector:
      node-role.kubernetes.io/worker: ""
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: "2"
        memory: 4Gi
    db:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "1"
          memory: 2Gi
  scanner:
    analyzer:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      scaling:
        autoScaling: Disabled
        replicas: 1
      resources:
        requests:
          cpu: 500m
          memory: 1500Mi
        limits:
          cpu: "2"
          memory: 4Gi
    scannerComponent: Enabled
  # ACS 5 dropped the StackRox scanner. Scanner V4 is the only scanner
  # Central integrates. Disabled leaves image checks with
  # "no image scanners are integrated" and an empty CVE report.
  scannerV4:
    scannerComponent: Enabled
    indexer:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      scaling:
        autoScaling: Disabled
        replicas: 1
    matcher:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      scaling:
        autoScaling: Disabled
        replicas: 1
    db:
      nodeSelector:
        node-role.kubernetes.io/worker: ""
      persistence:
        persistentVolumeClaim:
          # 10Gi fills up while importing RHEL VEX, the matcher never
          # finishes initializing, and every image check returns no CVEs.
          size: 50Gi
