# Shared Kafka Connect with Red Hat build of Debezium (PostgreSQL connector).
# Namespace is created by the operators layer (namespace-debezium.yaml).
# Templates only create KafkaConnector + database + consumer — no per-app Connect build.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaConnect
metadata:
  name: rhads-debezium
  namespace: debezium
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    strimzi.io/use-connector-resources: "true"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  replicas: 1
  bootstrapServers: rhads-kafka-kafka-bootstrap.kafka.svc:9092
  config:
    group.id: rhads-debezium
    offset.storage.topic: rhads-debezium-offsets
    config.storage.topic: rhads-debezium-configs
    status.storage.topic: rhads-debezium-status
    config.storage.replication.factor: 1
    offset.storage.replication.factor: 1
    status.storage.replication.factor: 1
    key.converter: org.apache.kafka.connect.json.JsonConverter
    value.converter: org.apache.kafka.connect.json.JsonConverter
    key.converter.schemas.enable: false
    value.converter.schemas.enable: false
  build:
    output:
      type: docker
      image: quay.CLUSTER_SUBDOMAIN_PLACEHOLDER/rhads/debezium-connect:latest
      pushSecret: quay-dockerconfig
    plugins:
      - name: debezium-postgres-connector
        artifacts:
          # Red Hat build of Debezium — PostgreSQL connector plugin (GA maven; zip, not tgz).
          - type: zip
            url: https://maven.repository.redhat.com/ga/io/debezium/debezium-connector-postgres/3.0.8.Final-redhat-00004/debezium-connector-postgres-3.0.8.Final-redhat-00004-plugin.zip
  template:
    pod:
      metadata:
        labels:
          app.kubernetes.io/part-of: rhads-demo
      # Same robot secret used to push the Connect build image.
      imagePullSecrets:
        - name: quay-dockerconfig
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
---
apiVersion: batch/v1
kind: Job
metadata:
  name: debezium-copy-quay-secret
  namespace: debezium
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    # Sync hook (not PreSync): wave -10 RBAC is applied first; Argo waits for this Job
    # before wave-0 KafkaConnect so pushSecret exists.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-5"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: debezium-bootstrap
      containers:
        - name: copy
          image: registry.redhat.io/openshift4/ose-cli-rhel9:v4.22
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              # Pull robot dockerconfig from rhads-ci (created by quay-config).
              for i in $(seq 1 36); do
                if oc -n rhads-ci get secret quay-dockerconfig >/dev/null 2>&1; then
                  break
                fi
                echo "waiting for quay-dockerconfig (${i}/36)"
                sleep 10
              done
              # Recreate without copying uid/resourceVersion (oc apply conflict).
              mkdir -p /tmp/qd
              oc -n rhads-ci extract secret/quay-dockerconfig --to=/tmp/qd --confirm
              oc -n debezium create secret generic quay-dockerconfig \
                --from-file=.dockerconfigjson=/tmp/qd/.dockerconfigjson \
                --type=kubernetes.io/dockerconfigjson \
                --dry-run=client -o yaml | oc apply -f -
              echo "PASS: quay-dockerconfig in debezium"
