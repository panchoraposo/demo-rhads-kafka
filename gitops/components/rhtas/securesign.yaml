# OIDC issuer uses CLUSTER_SUBDOMAIN_PLACEHOLDER (substituted when publishing to
# GitLab). PostSync job + Ansible also patch oidcIssuers as a safety net.
apiVersion: rhtas.redhat.com/v1alpha1
kind: Securesign
metadata:
  name: rhads-securesign
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  rekor:
    externalAccess:
      enabled: true
    rekorSearchUI:
      enabled: true
    monitoring:
      enabled: false
  trillian:
    database:
      create: true
    monitoring:
      enabled: false
  fulcio:
    externalAccess:
      enabled: true
    config:
      # RHTAS v1 CRD field is oidcIssuers (camelCase). publish-platform-repo
      # substitutes CLUSTER_SUBDOMAIN_PLACEHOLDER so Argo does not heal back to
      # a dead issuer and break Dev Spaces gitsign OIDC.
      oidcIssuers:
        - clientID: trusted-artifact-signer
          issuer: https://sso.CLUSTER_SUBDOMAIN_PLACEHOLDER/realms/backstage
          issuerURL: https://sso.CLUSTER_SUBDOMAIN_PLACEHOLDER/realms/backstage
          type: email
        # Tekton Chains keyless: projected SA token audience "sigstore"
        # (iss https://kubernetes.default.svc).
        - clientID: sigstore
          issuer: https://kubernetes.default.svc
          issuerURL: https://kubernetes.default.svc
          type: kubernetes
    certificate:
      organizationName: RHADS Demo
      organizationEmail: security@rhads.demo
      commonName: fulcio.rhads-demo
    monitoring:
      enabled: false
  tuf:
    externalAccess:
      enabled: true
    keys:
      - name: rekor.pub
      - name: ctfe.pub
      - name: fulcio_v1.crt.pem
      - name: tsa.certchain.pem
    pvc:
      accessModes:
        - ReadWriteOnce
      retain: true
      size: 100Mi
  ctlog:
    monitoring:
      enabled: false
  tsa:
    externalAccess:
      enabled: true
    monitoring:
      enabled: false
    ntpMonitoring:
      enabled: false
    signer:
      certificateChain:
        rootCA:
          organizationName: RHADS Demo
          organizationEmail: security@rhads.demo
          commonName: tsa.rhads-demo-root
        intermediateCA:
          - organizationName: RHADS Demo
            organizationEmail: security@rhads.demo
            commonName: tsa.rhads-demo-intermediate
        leafCA:
          organizationName: RHADS Demo
          organizationEmail: security@rhads.demo
          commonName: tsa.rhads-demo-leaf
