apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhads-patch-fulcio
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/part-of: rhads-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhads-patch-fulcio
  labels:
    app.kubernetes.io/part-of: rhads-demo
rules:
  - apiGroups: ["config.openshift.io"]
    resources: ["ingresses"]
    verbs: ["get", "list"]
  - apiGroups: ["rhtas.redhat.com"]
    resources: ["securesigns"]
    verbs: ["get", "list", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhads-patch-fulcio
  labels:
    app.kubernetes.io/part-of: rhads-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhads-patch-fulcio
subjects:
  - kind: ServiceAccount
    name: rhads-patch-fulcio
    namespace: trusted-artifact-signer
---
apiVersion: batch/v1
kind: Job
metadata:
  name: rhads-patch-fulcio-oidc
  namespace: trusted-artifact-signer
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: rhads-patch-fulcio
      containers:
        - name: patch
          image: registry.redhat.io/openshift4/ose-cli:latest
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              DOMAIN="$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}')"
              ISSUER="https://sso.${DOMAIN}/realms/backstage"
              echo "Patching Fulcio OIDC issuers: email=${ISSUER} kubernetes=https://kubernetes.default.svc"
              oc -n trusted-artifact-signer patch securesign rhads-securesign --type merge --patch-file=/dev/stdin <<EOF
              spec:
                fulcio:
                  config:
                    OIDCIssuers:
                      - ClientID: trusted-artifact-signer
                        Issuer: "${ISSUER}"
                        IssuerURL: "${ISSUER}"
                        Type: email
                      - ClientID: sigstore
                        Issuer: https://kubernetes.default.svc
                        IssuerURL: https://kubernetes.default.svc
                        Type: kubernetes
              EOF
              echo "PASS: Fulcio accepts Keycloak (gitsign) and Kubernetes SA (Chains keyless)"
