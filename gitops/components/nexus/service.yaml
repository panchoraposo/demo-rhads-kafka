apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus
  namespace: nexus
  labels:
    app.kubernetes.io/part-of: rhads-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: nexus
  labels:
    app: nexus
    app.kubernetes.io/part-of: rhads-demo
spec:
  selector:
    app: nexus
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: nexus
  namespace: nexus
  labels:
    app: nexus
    app.kubernetes.io/part-of: rhads-demo
spec:
  host: nexus.CLUSTER_SUBDOMAIN_PLACEHOLDER
  to:
    kind: Service
    name: nexus
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
