apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: perses-dashboard-viewer
  namespace: rhads-observability
rules:
  - apiGroups: [perses.dev]
    resources: [persesdashboards, persesdatasources]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: perses-dashboard-viewer-devs
  namespace: rhads-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: perses-dashboard-viewer
subjects:
  - kind: Group
    name: developers
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: platform-engineers
    apiGroup: rbac.authorization.k8s.io
