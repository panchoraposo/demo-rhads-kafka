apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: rhads-trip-planner-apps
  namespace: rhads-observability
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  config:
    display:
      name: RHADS Trip Planner — app health
      description: CPU and HTTP traffic for trip planner apps scaffolded from the Quarkus or Go templates
    duration: 15m
    refreshInterval: 30s
    panels:
      pod_cpu:
        kind: Panel
        spec:
          display:
            name: CPU usage (dev apps)
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus-rhads
                    query: sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{namespace=~".*-dev",container!="",container!="POD"}[5m]))
      pod_mem:
        kind: Panel
        spec:
          display:
            name: Memory working set (dev apps)
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus-rhads
                    query: sum by (namespace, pod) (container_memory_working_set_bytes{namespace=~".*-dev",container!="",container!="POD"})
      http_requests:
        kind: Panel
        spec:
          display:
            name: HTTP bytes written (Micrometer / Go)
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: prometheus-rhads
                    query: sum by (namespace) (rate(http_server_bytes_written_count{namespace=~".*-dev"}[5m])) or sum by (namespace) (rate(http_requests_total{namespace=~".*-dev"}[5m]))
    layouts:
      - kind: Grid
        spec:
          display:
            title: Applications
          items:
            - x: 0
              "y": 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/pod_cpu"
            - x: 12
              "y": 0
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/pod_mem"
            - x: 0
              "y": 8
              width: 24
              height: 8
              content:
                $ref: "#/spec/panels/http_requests"
