apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgresql
  namespace: keycloak
  labels:
    app.kubernetes.io/part-of: rhads-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhads-keycloak-postgresql-anyuid
  labels:
    app.kubernetes.io/part-of: rhads-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:anyuid
subjects:
  - kind: ServiceAccount
    name: postgresql
    namespace: keycloak
