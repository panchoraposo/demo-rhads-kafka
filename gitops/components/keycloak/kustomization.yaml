apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak
# Applied only when Ansible deploys Keycloak. Workshop clusters already have
# RHBK + realm `sso` for OpenShift login; that instance is left untouched.
resources:
  - namespace.yaml
  - postgresql-rbac.yaml
  - postgresql.yaml
  - db-secret.yaml
