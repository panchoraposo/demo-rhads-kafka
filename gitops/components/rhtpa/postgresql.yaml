apiVersion: v1
kind: ConfigMap
metadata:
  name: tpa-postgresql-cfg
  namespace: trusted-profile-analyzer
data:
  # Included on every start by the RHEL PostgreSQL image
  # ($APP_DATA/src/postgresql-cfg/*.conf). TPA opens a subtransaction while
  # it joins advisories. Once the CVE tables are large, the planner
  # parallelizes that scan and PostgreSQL rejects it with
  # "cannot start subtransactions during a parallel operation". The UI
  # shows that 500 as "Unable to connect".
  parallel.conf: |
    max_parallel_workers_per_gather = 0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tpa-postgresql
  namespace: trusted-profile-analyzer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 40Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpa-postgresql
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/name: tpa-postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tpa-postgresql
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpa-postgresql
    spec:
      serviceAccountName: postgresql
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        fsGroup: 26
      containers:
        - name: postgresql
          image: registry.redhat.io/rhel9/postgresql-16:latest
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: db.user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: db.password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: db.name
            - name: POSTGRESQL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-admin-credentials
                  key: db.password
            # Server and importer each open a 75-connection pool, and the
            # importer hooks need another. The image default of 100 stalls
            # those hooks before the CVE feeds can be enabled.
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: "300"
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: postgresql-cfg
              mountPath: /opt/app-root/src/postgresql-cfg
              readOnly: true
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tpa-postgresql
        - name: postgresql-cfg
          configMap:
            name: tpa-postgresql-cfg
---
apiVersion: v1
kind: Service
metadata:
  name: tpa-postgresql
  namespace: trusted-profile-analyzer
spec:
  selector:
    app.kubernetes.io/name: tpa-postgresql
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
