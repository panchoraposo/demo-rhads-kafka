# After a large Syft SBOM ingest, stats on the small SBOM tables go stale
# and GET /api/v3/sbom/{id} can take >30s. Refresh those tables only.
# A full-database ANALYZE re-reads the CVE tables and stalls the UI.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tpa-pg-analyze
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: rhads-demo
spec:
  # A fresh Syft SBOM stales the small SBOM tables. Refresh only those.
  # ANALYZE of the whole database re-reads the CVE tables (purl_status is
  # several GB) and was running almost continuously, which made the SBOM
  # list wait on disk.
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: Exists
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: analyze
              image: registry.redhat.io/rhel9/postgresql-16:latest
              env:
                - name: PGHOST
                  value: tpa-postgresql
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.user
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.name
              command:
                - /bin/bash
                - -c
                - psql -v ON_ERROR_STOP=1 -c "ANALYZE sbom, sbom_package, sbom_node, sbom_node_purl_ref, sbom_node_cpe_ref, sbom_describing_cpe, base_purl, versioned_purl, qualified_purl"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
