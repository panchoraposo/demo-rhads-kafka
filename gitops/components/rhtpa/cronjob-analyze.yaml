# After a large Syft SBOM ingest, Postgres stats go stale and
# GET /api/v3/sbom/{id} can take >30s. The OpenShift route then
# times out and the TPA UI shows a generic Error page.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tpa-pg-analyze
  namespace: trusted-profile-analyzer
  labels:
    app.kubernetes.io/part-of: rhads-demo
spec:
  # Large Syft SBOMs stale the planner between 10-minute ticks and the
  # OpenShift route cuts GET /api/v3/sbom/{id} at 30s (generic UI Error).
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/worker
                        operator: Exists
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: analyze
              image: registry.redhat.io/rhel9/postgresql-16:latest
              env:
                - name: PGHOST
                  value: tpa-postgresql
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.user
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.password
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: postgresql-credentials
                      key: db.name
              command:
                - /bin/bash
                - -c
                - psql -v ON_ERROR_STOP=1 -c ANALYZE
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
