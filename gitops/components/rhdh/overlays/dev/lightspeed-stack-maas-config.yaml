apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-stack-maas-config
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: rhads-demo
data:
  lightspeed-stack.yaml: |
    #
    # Lightspeed Core stack for RHDH 2.1.
    # Inference providers live here. The 1.10 llama-stack config.yaml is not mounted.
    # MCP authorization is a file path: LCS reads it and llama-stack adds "Bearer ".
    name: lightspeed-core-stack
    service:
      host: ${env.SERVICE_HOST:=127.0.0.1}
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
    llama_stack:
      use_as_library_client: true
      config:
        baseline: byo-llm
        native_override:
          vector_stores:
            annotation_prompt_params:
              enable_annotations: true
              annotation_instruction_template: >
                When appropriate, cite sources at the end of sentences using doc_url and doc_title format.
                Citing sources is not always required because citations are handled externally.
                Never include any citation that is in the form '<| file-id |>'.
    inference:
      default_provider: vllm
      default_model: ${env.MAAS_MODEL:=qwen3-14b}
      providers:
        - type: sentence_transformers
        - type: vllm
          id: vllm
          api_key_env: VLLM_API_KEY
          allowed_models:
            - ${env.MAAS_MODEL:=qwen3-14b}
          extra:
            base_url: ${env.VLLM_URL:=}
            max_tokens: ${env.VLLM_MAX_TOKENS:=4096}
            network:
              tls:
                verify: ${env.VLLM_TLS_VERIFY:=true}
    vector_store:
      default_provider: notebooks
      providers:
        - id: notebooks
          type: faiss
          embedding_model: nomic-ai/nomic-embed-text-v1.5
          embedding_dimension: 768
          config:
            path: /tmp/vector_db/notebooks/faiss_store.db
    user_data_collection:
      feedback_enabled: true
      feedback_storage: '/tmp/data/feedback'
    authentication:
      module: 'noop'
    conversation_cache:
      type: 'sqlite'
      sqlite:
        db_path: '/tmp/cache.db'
    customization:
      profile_path: '/app-root/rhdh-profile.py'
    shields:
      - name: lightspeed_question_validity
        provider_id: ${env.ENABLE_VALIDATION:=__disabled__}
        config:
          model_id: ${env.VALIDATION_PROVIDER}/${env.VALIDATION_MODEL_NAME}
          model_prompt: |-
            Instructions:
            You are a question classifier for an enterprise developer assistant.
            Respond with ONLY ${allowed} or ${rejected}.
            Question:
            ${message}
            Response:
          invalid_question_response: |-
            Hi, I'm the Red Hat Developer Hub Intelligent Assistant.
            I can help with software development, developer tooling, and this portal's catalog.
    mcp_servers:
      - name: mcp-integration-tools
        provider_id: 'model-context-protocol'
        url: 'http://localhost:7007/api/mcp-actions/v1'
        authorization_headers:
          Authorization: /etc/lightspeed-mcp/authorization
