apiVersion: v1
kind: ConfigMap
metadata:
  name: lightspeed-stack-maas-config
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: rhads-demo
data:
  lightspeed-stack.yaml: |
    #
    # Lightspeed Core Stack — RHADS demo (MaaS + catalog MCP).
    # authorization_headers values that are not keywords (client/kubernetes/oauth)
    # are read as secret file paths by LCS.
    name: lightspeed-core-stack
    service:
      host: ${env.SERVICE_HOST:=127.0.0.1}
      port: 8080
      auth_enabled: false
      workers: 1
      color_log: true
      access_log: true
    llama_stack:
      use_as_library_client: true
      library_client_config_path: /app-root/config.yaml
    user_data_collection:
      feedback_enabled: true
      feedback_storage: '/tmp/data/feedback'
    authentication:
      module: 'noop'
    conversation_cache:
      type: 'sqlite'
      sqlite:
        db_path: '/tmp/cache.db'
    customization:
      profile_path: '/app-root/rhdh-profile.py'
    mcp_servers:
      - name: mcp-integration-tools
        provider_id: 'model-context-protocol'
        url: 'http://localhost:7007/api/mcp-actions/v1'
        authorization_headers:
          Authorization: /etc/lightspeed-mcp/authorization
