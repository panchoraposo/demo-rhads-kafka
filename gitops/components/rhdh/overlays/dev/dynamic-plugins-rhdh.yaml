kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins-rhdh
  namespace: backstage
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # Supported plugins ship as standalone OCI images in the 2.1 catalog.
      # {{inherit}} selects the digest from dynamic-plugins.default.yaml.
      # Wrappers under ./dynamic-plugins/dist were removed from the hub image.
      # 2.1 disables every auth provider module. The sign-in page still calls
      # /api/auth/oidc/start, which 404s with "Unknown auth provider 'oidc'"
      # until this module is installed. Values match app-config.yaml.
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-auth-backend-module-oidc-provider:{{inherit}}
        enabled: true
        pluginConfig:
          auth:
            providers:
              oidc:
                production:
                  prompt: auto
                  metadataUrl: https://sso.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/realms/backstage/.well-known/openid-configuration
                  clientId: backstage
                  clientSecret: ${OAUTH_CLIENT_SECRET}
                  callbackUrl: https://rhdh.${OPENSHIFT_CLUSTER_INGRESS_DOMAIN}/api/auth/oidc/handler/frame
                  additionalScopes:
                    - openid
                    - profile
                    - email
                  signIn:
                    resolvers:
                      # The 2.1 module schema lists preferredUsernameMatchingUserEntityName
                      # but does not register it. Email local-part matches these users.
                      - resolver: emailLocalPartMatchingUserEntityName
                        dangerouslyAllowSignInWithoutUserInCatalog: true
                      - resolver: emailMatchingUserEntityProfileEmail
                        dangerouslyAllowSignInWithoutUserInCatalog: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-topology:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-kubernetes:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-kubernetes-backend:{{inherit}}
        enabled: true
        pluginConfig:
          # Replace the catalog default, which requires K8S_CLUSTER_* env vars
          # this demo does not set. Cluster config also lives in app-config.yaml.
          kubernetes:
            serviceLocatorMethod:
              type: multiTenant
            customResources:
              - group: tekton.dev
                apiVersion: v1
                plural: pipelines
              - group: tekton.dev
                apiVersion: v1
                plural: pipelineruns
              - group: tekton.dev
                apiVersion: v1
                plural: taskruns
              - group: route.openshift.io
                apiVersion: v1
                plural: routes
            clusterLocatorMethods:
              - type: config
                clusters:
                  - url: https://kubernetes.default.svc
                    name: demo-cluster
                    authProvider: serviceAccount
                    skipTLSVerify: true
                    serviceAccountToken: ${KUBERNETES_SA_TOKEN}
                    customResources:
                      - group: tekton.dev
                        apiVersion: v1
                        plural: pipelines
                      - group: tekton.dev
                        apiVersion: v1
                        plural: pipelineruns
                      - group: tekton.dev
                        apiVersion: v1
                        plural: taskruns
                      - group: route.openshift.io
                        apiVersion: v1
                        plural: routes
      - package: oci://registry.access.redhat.com/rhdh/backstage-community-plugin-rbac:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-scaffolder-backend-module-gitlab:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-catalog-backend-module-gitlab:{{inherit}}
        enabled: true
        pluginConfig:
          catalog:
            providers:
              gitlab:
                default:
                  host: ${GITLAB_HOST}
                  group: developers
                  orgEnabled: false
                  schedule:
                    frequency: { minutes: 5 }
                    timeout: { minutes: 3 }
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-techdocs:{{inherit}}
        enabled: true
      - package: oci://registry.access.redhat.com/rhdh/backstage-plugin-techdocs-backend:{{inherit}}
        enabled: true
      # Community plugins built for Backstage 1.54.9 (RHDH 2.1).
      # Tekton and Argo CD register their own entity content on the new
      # frontend. Legacy entity.page.* mount points do not render.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:bs_1.54.9__4.0.5!backstage-community-plugin-tekton
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                translationResources:
                  - importName: tektonTranslations
                    ref: tektonTranslationRef
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:bs_1.54.9__1.38.3!backstage-community-plugin-quay
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay-backend:bs_1.54.9__1.18.1!backstage-community-plugin-quay-backend
        enabled: true
        pluginConfig:
          quay:
            apiUrl: ${QUAY_UI_URL}
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-scaffolder-backend-module-quay:bs_1.54.9__2.22.1!backstage-community-plugin-scaffolder-backend-module-quay
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.54.9__1.7.2!backstage-community-plugin-argocd-backend
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.54.9__3.1.3!backstage-community-plugin-argocd
        enabled: true
      # GitLab cards and the GitLab tab. No Backstage 1.54 export exists yet.
      # The 6.13.0 package also registers gitlabFillerProcessor, which needs
      # catalogProcessingExtensionPoint from the catalog alpha API. That
      # export is gone in 2.1 and aborts startup, so the Hub init container
      # drops the filler and leaves the REST proxy. Catalog import and
      # scaffolder still use the supported GitLab modules.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab-backend:bs_1.45.3__6.13.0!immobiliarelabs-backstage-plugin-gitlab-backend
        enabled: true
        pluginConfig:
          gitlab:
            # Workshop GitLab is served with the cluster CA. The proxy
            # verifies certificates unless this is false, and the cards then
            # fail closed.
            proxySecure: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab:bs_1.45.3__6.13.0!immobiliarelabs-backstage-plugin-gitlab
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              immobiliarelabs.backstage-plugin-gitlab:
                mountPoints:
                  - mountPoint: entity.page.ci/cards
                    importName: EntityGitlabPipelinesTable
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isGitlabAvailable
      # Vault has no 1.54 export. 0.19.0 is the module-federation frontend;
      # 0.18.0 only shipped Scalprum, which 2.1 does not load.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault:pr_1225__0.19.0!backstage-community-plugin-vault
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-vault:
                entityTabs:
                  - path: /vault
                    title: Vault
                    mountPoint: entity.page.vault
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: EntityVaultCard
                    config:
                      layout:
                        gridColumnEnd:
                          lg: "span 6"
                          xs: "span 12"
                      if:
                        allOf:
                          - isVaultAvailable
                  - mountPoint: entity.page.vault/cards
                    importName: EntityVaultCard
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isVaultAvailable
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault-backend:pr_1225__0.21.0!backstage-community-plugin-vault-backend
        enabled: true
      # Apicurio Registry — community plugin, no OCI overlay.
      # Source: https://github.com/simonnepomuk/backstage-plugin-apicurio-registry
      # Patched for Registry 2.6 UI paths (/ui/artifacts) + v2 version metadata fields.
      - package: https://raw.githubusercontent.com/panchoraposo/demo-rhads-kafka/main/gitops/components/rhdh/plugins/simonnepomuk-backstage-plugin-apicurio-registry-dynamic-0.1.5.tgz
        integrity: sha512-HJL8e/R9tcgoRvyQR1XE2P+jWsfVQfQNaBZ8k3E0qhkedKtSI3wOT9E98OpiVDUscLdDmuRgyNPOyTDmMZSctg==
        enabled: true
        pluginConfig:
          dynamicPlugins:
            frontend:
              simonnepomuk.backstage-plugin-apicurio-registry:
                entityTabs:
                  - path: /apicurio-registry
                    title: Apicurio Registry
                    mountPoint: entity.page.apicurio-registry
                mountPoints:
                  - mountPoint: entity.page.apicurio-registry/cards
                    importName: ApicurioRegistryPage
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isKind: api
      # MCP actions for the Intelligent Assistant (Backstage 1.54.9).
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.54.9__0.2.1!backstage-plugin-mcp-actions-backend
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.54.9__0.2.5!red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.54.9__0.2.6!red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.54.9__0.4.4!red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras
        enabled: true
      # Scorecard + DORA (RHDH 2.1 Technology Preview). The DORA module
      # computes the four metrics; the frontend draws the component tab
      # and the home-page cards. Default collectors are GitHub and Jira.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard:bs_1.54.9__4.5.2!red-hat-developer-hub-backstage-plugin-scorecard
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend:bs_1.54.9__4.5.2!red-hat-developer-hub-backstage-plugin-scorecard-backend
        enabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scorecard-backend-module-dora:bs_1.54.9__0.2.6!red-hat-developer-hub-backstage-plugin-scorecard-backend-module-dora
        enabled: true
