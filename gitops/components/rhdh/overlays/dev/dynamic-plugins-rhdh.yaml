kind: ConfigMap
apiVersion: v1
metadata:
  name: dynamic-plugins-rhdh
  namespace: backstage
data:
  dynamic-plugins.yaml: |
    includes:
      - dynamic-plugins.default.yaml
    plugins:
      # GA plugins bundled in the RHDH 1.10 hub image
      - package: ./dynamic-plugins/dist/backstage-community-plugin-topology
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage.plugin-kubernetes:
                mountPoints:
                  - mountPoint: entity.page.kubernetes/cards
                    importName: EntityKubernetesContent
                    config:
                      layout:
                        gridColumn: "1 / -1"
      - package: ./dynamic-plugins/dist/backstage-plugin-kubernetes-backend-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-catalog-backend-module-keycloak-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-community-plugin-rbac
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-scaffolder-backend-module-gitlab-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-catalog-backend-module-gitlab-dynamic
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-techdocs
        disabled: false
      - package: ./dynamic-plugins/dist/backstage-plugin-techdocs-backend-dynamic
        disabled: false
      # Community plugins shipped via the 1.10 catalog index (inherit the digest)
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-tekton:{{inherit}}
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-tekton:
                mountPoints:
                  - mountPoint: entity.page.ci/cards
                    importName: TektonCI
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isTektonCIAvailable
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay:{{inherit}}
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-quay-backend:{{inherit}}
        disabled: false
        pluginConfig:
          quay:
            apiUrl: ${QUAY_UI_URL}
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-scaffolder-backend-module-quay:{{inherit}}
        disabled: false
      # Argo CD — Red Hat / Backstage Community (not Roadie).
      # Scaffolder actions ship in the community backend; no separate Roadie scaffolder plugin.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd-backend:bs_1.49.4__1.4.0
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-argocd:bs_1.49.4__2.8.1
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-argocd:
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: ArgocdDeploymentSummary
                    config:
                      layout:
                        gridColumnEnd:
                          lg: "span 8"
                          xs: "span 12"
                      if:
                        allOf:
                          - isArgocdConfigured
                  - mountPoint: entity.page.cd/cards
                    importName: ArgocdDeploymentLifecycle
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isArgocdConfigured
      # Explicitly keep Roadie Argo CD off if the default catalog pulls it in.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd-backend:{{inherit}}
        disabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-backstage-plugin-argo-cd:bs_1.49.4__2.12.5
        disabled: true
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/roadiehq-scaffolder-backend-argocd:{{inherit}}
        disabled: true
      # GitLab pipelines on the CI tab (docs-only .gitlab-ci.yml) next to Tekton.
      # 7.0.1 targets MUI 7 and crashes the Hub (internal_mutateStyles). 6.13.0
      # shares the Hub MUI 5 / react-router 6 stack. Skip 6.13.1 and 7.0.2 (npm compromise).
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab-backend:bs_1.45.3__6.13.0!immobiliarelabs-backstage-plugin-gitlab-backend
        disabled: false
        pluginConfig:
          gitlab:
            host: ${GITLAB_HOST}
            token: ${GITLAB_TOKEN}
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/immobiliarelabs-backstage-plugin-gitlab:bs_1.45.3__6.13.0!immobiliarelabs-backstage-plugin-gitlab
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              immobiliarelabs.backstage-plugin-gitlab:
                mountPoints:
                  - mountPoint: entity.page.ci/cards
                    importName: EntityGitlabPipelinesTable
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isGitlabAvailable
      # HashiCorp Vault — not in the RHDH catalog index, so {{inherit}} fails.
      # Frontend 0.19.0 dropped dist-scalprum (module-federation only) and never
      # registers in /api/scalprum/plugins. Pin 0.18.0 which still ships scalprum.
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault:pr_1225__0.18.0!backstage-community-plugin-vault
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              backstage-community.plugin-vault:
                entityTabs:
                  - path: /vault
                    title: Vault
                    mountPoint: entity.page.vault
                mountPoints:
                  - mountPoint: entity.page.overview/cards
                    importName: EntityVaultCard
                    config:
                      layout:
                        gridColumnEnd:
                          lg: "span 6"
                          xs: "span 12"
                      if:
                        allOf:
                          - isVaultAvailable
                  - mountPoint: entity.page.vault/cards
                    importName: EntityVaultCard
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isVaultAvailable
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-community-plugin-vault-backend:pr_1225__0.21.0!backstage-community-plugin-vault-backend
        disabled: false
      # Apicurio Registry — community plugin (no OCI overlay in rhdh-plugin-export-overlays).
      # Hosted in this repo so installs are cluster-independent (not a per-cluster GitLab URL).
      # Source: https://github.com/simonnepomuk/backstage-plugin-apicurio-registry
      # Patched for Registry 2.6 UI paths (/ui/artifacts) + v2 version metadata fields.
      - package: https://raw.githubusercontent.com/panchoraposo/demo-rhads-kafka/main/gitops/components/rhdh/plugins/simonnepomuk-backstage-plugin-apicurio-registry-dynamic-0.1.5.tgz
        integrity: sha512-HJL8e/R9tcgoRvyQR1XE2P+jWsfVQfQNaBZ8k3E0qhkedKtSI3wOT9E98OpiVDUscLdDmuRgyNPOyTDmMZSctg==
        disabled: false
        pluginConfig:
          dynamicPlugins:
            frontend:
              simonnepomuk.backstage-plugin-apicurio-registry:
                entityTabs:
                  - path: /apicurio-registry
                    title: Apicurio Registry
                    mountPoint: entity.page.apicurio-registry
                mountPoints:
                  - mountPoint: entity.page.apicurio-registry/cards
                    importName: ApicurioRegistryPage
                    config:
                      layout:
                        gridColumn: "1 / -1"
                      if:
                        allOf:
                          - isKind: api
      # MCP — Backstage actions server + Red Hat extras (catalog / TechDocs / scaffolder).
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/backstage-plugin-mcp-actions-backend:bs_1.49.4__0.1.11
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-software-catalog-mcp-extras:bs_1.49.4__0.2.2
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-techdocs-mcp-extras:bs_1.49.4__0.2.3
        disabled: false
      - package: oci://ghcr.io/redhat-developer/rhdh-plugin-export-overlays/red-hat-developer-hub-backstage-plugin-scaffolder-mcp-extras:bs_1.49.4__0.4.1
        disabled: false
