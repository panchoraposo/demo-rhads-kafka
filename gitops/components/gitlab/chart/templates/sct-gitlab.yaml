apiVersion: v1
stringData:
  DB_PASS: {{ $.Values.postgresql.dbPassword }}
  GITLAB_ROOT_PASSWORD: "{{ $.Values.gitlab.rootPassword }}"
  SMTP_PASS: {{ $.Values.gitlab.smtp.password | default "gitlab" | quote }}
kind: Secret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app: gitlab
  name: gitlab-secret
type: Opaque
