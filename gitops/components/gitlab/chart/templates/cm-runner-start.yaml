apiVersion: v1
kind: ConfigMap
metadata:
  labels:
    app: gitlab-runner
  name: gitlab-runner-start
  annotations:
    argocd.argoproj.io/sync-wave: "3"
data:
  runner-start.sh: |
    #!/bin/bash
    set -euo pipefail
    TOKEN_FILE="${RUNNER_TOKEN_FILE:-/runner-token/token}"
    echo "RHADS: waiting for GitLab runner token"
    token=""
    while true; do
      if [ -f "${TOKEN_FILE}" ]; then
        token="$(tr -d '[:space:]' < "${TOKEN_FILE}")"
      fi
      if [ -n "${token}" ] && [ "${token}" != "pending" ]; then
        break
      fi
      sleep 5
    done

    if command -v apt-get >/dev/null 2>&1; then
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -qq
      apt-get install -y -qq python3 python3-pip python3-venv git >/dev/null
    elif command -v apk >/dev/null 2>&1; then
      apk add --no-cache python3 py3-pip git >/dev/null
    fi
    python3 -m pip install --break-system-packages -q mkdocs mkdocs-techdocs-core \
      || python3 -m pip install -q mkdocs mkdocs-techdocs-core

    GITLAB_URL="${GITLAB_URL:-http://gitlab.gitlab.svc}"
    cat > /tmp/config.toml <<EOF
    concurrent = 2
    check_interval = 3
    listen_address = ":9252"

    [[runners]]
      name = "rhads-docs"
      url = "${GITLAB_URL}"
      clone_url = "${GITLAB_URL}"
      token = "${token}"
      executor = "shell"
      shell = "bash"
    EOF

    echo "RHADS: starting GitLab runner (docs / TechDocs only)"
    exec gitlab-runner run -c /tmp/config.toml --user root
