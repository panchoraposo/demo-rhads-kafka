apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app: vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
        app.kubernetes.io/part-of: rhads-demo
    spec:
      serviceAccountName: vault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/worker
                    operator: Exists
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      securityContext:
        runAsNonRoot: true
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: vault
          image: docker.io/hashicorp/vault:1.19.5
          imagePullPolicy: IfNotPresent
          command:
            - vault
          args:
            - server
            - -config=/vault/config/vault.hcl
          ports:
            - name: http
              containerPort: 8200
          env:
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
            - name: SKIP_SETCAP
              value: "true"
            - name: SKIP_CHOWN
              value: "true"
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsUser: 100
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /vault/config
              readOnly: true
            - name: data
              mountPath: /vault/data
        - name: unseal
          image: registry.redhat.io/openshift4/ose-cli:latest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              VAULT_ADDR=http://127.0.0.1:8200
              echo "Waiting for Vault listener"
              until curl -sf "$VAULT_ADDR/v1/sys/seal-status" >/dev/null; do
                sleep 2
              done
              while true; do
                KEY="${UNSEAL_KEY:-}"
                if [ -z "$KEY" ]; then
                  sleep 10
                  continue
                fi
                SEALED="$(curl -sf "$VAULT_ADDR/v1/sys/seal-status" | sed -n 's/.*"sealed":\([^,}]*\).*/\1/p' | head -1)"
                if [ "$SEALED" = "true" ]; then
                  curl -sf --request PUT --data "{\"key\":\"${KEY}\"}" "$VAULT_ADDR/v1/sys/unseal" >/dev/null || true
                fi
                sleep 10
              done
          env:
            - name: UNSEAL_KEY
              valueFrom:
                secretKeyRef:
                  name: vault-init
                  key: unseal_key
                  optional: true
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap:
            name: vault-config
        - name: data
          persistentVolumeClaim:
            claimName: vault-data
