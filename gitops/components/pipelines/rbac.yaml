apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhads-pipeline
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "serviceaccounts"]
    verbs: ["get", "list"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhads-pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhads-pipeline
subjects:
  - kind: Group
    name: system:serviceaccounts
    apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhads-pipeline-privileged
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:openshift:scc:privileged
subjects:
  - kind: ServiceAccount
    name: pipeline
    namespace: rhads-ci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhads-ci-secrets
  namespace: rhads-ci
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhads-ci-default-secrets
  namespace: rhads-ci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhads-ci-secrets
subjects:
  - kind: ServiceAccount
    name: default
    namespace: rhads-ci
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rhads-chains
  namespace: rhads-ci
  labels:
    app.kubernetes.io/part-of: rhads-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rhads-enable-chains
  labels:
    app.kubernetes.io/part-of: rhads-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: rhads-chains
    namespace: rhads-ci
