apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rhads-m2-warm
  namespace: rhads-ci
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/component: maven-cache
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi