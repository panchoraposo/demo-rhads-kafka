# ClusterExternalSecret: when a template creates {app}-dev/staging/prod with
# label rhads.demo/ci-secrets=true, ESO materializes native Secrets from Vault.
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: rhads-gitlab-token
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshTime: 1m
  namespaceSelectors:
    - matchLabels:
        rhads.demo/ci-secrets: "true"
  externalSecretName: gitlab-token
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    target:
      name: gitlab-token
      creationPolicy: Owner
    dataFrom:
      - extract:
          key: rhads/ci/gitlab-token
---
apiVersion: external-secrets.io/v1
kind: ClusterExternalSecret
metadata:
  name: rhads-quay-dockerconfig
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshTime: 1m
  namespaceSelectors:
    - matchLabels:
        rhads.demo/ci-secrets: "true"
  externalSecretName: quay-dockerconfig
  externalSecretSpec:
    refreshInterval: 1m
    secretStoreRef:
      name: vault-backend
      kind: ClusterSecretStore
    target:
      name: quay-dockerconfig
      creationPolicy: Owner
      template:
        engineVersion: v2
        type: kubernetes.io/dockerconfigjson
        data:
          .dockerconfigjson: "{{ .dockerconfigjson }}"
    data:
      - secretKey: dockerconfigjson
        remoteRef:
          key: rhads/ci/quay-dockerconfig
          property: dockerconfigjson
---
