# Additive allow-all egress in case the operand's default deny-all is active
# before ExternalSecretsConfig.networkPolicies is honored.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhads-allow-eso-egress
  namespace: external-secrets
  labels:
    app.kubernetes.io/part-of: rhads-demo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - {}
