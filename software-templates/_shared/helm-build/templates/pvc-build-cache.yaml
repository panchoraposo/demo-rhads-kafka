apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "rhads-build.name" . }}-build-cache
  labels:
    {{- include "rhads-build.labels" . | nindent 4 }}
    app.kubernetes.io/component: build-cache
  annotations:
    # The RBD class uses WaitForFirstConsumer; the claim stays Pending until the first
    # PipelineRun mounts it. Skip Argo health so sync is not blocked on that bind.
    argocd.argoproj.io/sync-options: DisableResourceHealthCheck=true
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.build.cacheSize | default "8Gi" }}