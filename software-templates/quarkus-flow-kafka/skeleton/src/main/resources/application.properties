# ${{values.component_id}} — Agentic Trip Planner (Quarkus Flow + Kafka + MaaS)
quarkus.application.name=${{values.component_id}}
quarkus.application.version=1.0-SNAPSHOT
quarkus.http.port=${{values.port}}
quarkus.http.host=0.0.0.0
quarkus.banner.enabled=true

quarkus.smallrye-openapi.info-title=Agentic Trip Planner — Quarkus Flow/Kafka
quarkus.smallrye-openapi.info-description=${{values.description}}
quarkus.smallrye-openapi.info-version=3.33.3
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
quarkus.log.console.charset=UTF-8
quarkus.log.category."com.tripplanner".level=INFO
quarkus.log.category."io.quarkiverse.flow".level=DEBUG
quarkus.log.category."io.serverlessworkflow".level=DEBUG

quarkus.http.static-resources.caching-enabled=false
# /.*/ (not /./): browsers send Origin on POST even for same-origin fetch.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.methods=GET,HEAD,POST,PUT,DELETE,PATCH,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,origin

# Dev Spaces reverse-proxy (Dev UI + live reload).
%dev.quarkus.http.host=0.0.0.0
%dev.quarkus.http.port=8080
%dev.quarkus.live-reload.instrumentation=true
%dev.quarkus.http.proxy.proxy-address-forwarding=true
%dev.quarkus.http.proxy.allow-x-forwarded=true
%dev.quarkus.http.proxy.enable-forwarded-host=true
%dev.quarkus.http.proxy.enable-forwarded-prefix=true
%dev.quarkus.dev-ui.hosts=^devspaces\\.apps\\..*$
%dev.quarkus.dev-ui.cors.enabled=false
%dev.quarkus.dev-ui.context-root=${QUARKUS_DEV_UI_CONTEXT_ROOT:}
%dev.quarkus.http.cors.access-control-allow-credentials=true
%dev.quarkus.test.continuous-testing=disabled
quarkus.analytics.disabled=true

# ---------------------------------------------------------------------------
# LLM — Red Hat MaaS (OpenAI-compatible). Timeouts 300s so Qwen3 is not cut off.
# Dev Spaces: Command palette → Quarkus dev. Set MAAS_API_KEY in .env if empty.
# ---------------------------------------------------------------------------
demo.llm.label=MaaS ${MAAS_MODEL:${{values.maas_model}}}
demo.llm.disable-thinking=true

quarkus.langchain4j.chat-model.provider=openai
quarkus.langchain4j.openai.enable-integration=true
quarkus.langchain4j.openai.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
quarkus.langchain4j.openai.api-key=${MAAS_API_KEY:}
quarkus.langchain4j.openai.chat-model.model-name=${MAAS_MODEL:${{values.maas_model}}}
quarkus.langchain4j.openai.chat-model.temperature=0.7
quarkus.langchain4j.openai.timeout=300s
quarkus.langchain4j.openai.max-retries=4
quarkus.rest-client.connect-timeout=30000
quarkus.rest-client.read-timeout=300000
quarkus.langchain4j.log-requests=false
quarkus.langchain4j.log-responses=false
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false
quarkus.langchain4j.devservices.enabled=false

# Enhanced model for adaptive selection (vehicle refinement) — same MaaS endpoint
quarkus.langchain4j.enhancedModel.chat-model.provider=openai
quarkus.langchain4j.openai.enhancedModel.base-url=${MAAS_BASE_URL:${{values.maas_base_url}}}
quarkus.langchain4j.openai.enhancedModel.api-key=${MAAS_API_KEY:}
quarkus.langchain4j.openai.enhancedModel.chat-model.model-name=${MAAS_MODEL:${{values.maas_model}}}
quarkus.langchain4j.openai.enhancedModel.chat-model.temperature=0.7
quarkus.langchain4j.openai.enhancedModel.timeout=300s

# Skills configuration
quarkus.langchain4j.skills.directories=classpath:skills
%dev.quarkus.live-reload.watched-resources=skills/family-trip/SKILL.md

# Quarkus Flow messaging bridge
quarkus.flow.messaging.defaults-enabled=true

# Kafka channels for Flow events (workshop flow-in / flow-out)
mp.messaging.incoming.flow-in.connector=smallrye-kafka
mp.messaging.incoming.flow-in.topic=flow-in
mp.messaging.incoming.flow-in.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-in.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer

mp.messaging.outgoing.flow-out.connector=smallrye-kafka
mp.messaging.outgoing.flow-out.topic=flow-out
mp.messaging.outgoing.flow-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.flow-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.outgoing.flow-in-producer.connector=smallrye-kafka
mp.messaging.outgoing.flow-in-producer.topic=flow-in
mp.messaging.outgoing.flow-in-producer.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
mp.messaging.outgoing.flow-in-producer.key.serializer=org.apache.kafka.common.serialization.StringSerializer

mp.messaging.incoming.flow-out-consumer.connector=smallrye-kafka
mp.messaging.incoming.flow-out-consumer.topic=flow-out
mp.messaging.incoming.flow-out-consumer.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-consumer.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.flow-out-consumer.auto.offset.reset=earliest

# Cluster Kafka (Streams for Apache Kafka). No Dev Services in prod.
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:rhads-kafka-kafka-bootstrap.kafka.svc:9092}
%prod.quarkus.kafka.devservices.enabled=false
# Local/dev: Dev Services Kafka is fine when KAFKA_BOOTSTRAP_SERVERS is unset and no cluster Kafka.
%dev.quarkus.kafka.devservices.enabled=${KAFKA_DEVSERVICES:true}
