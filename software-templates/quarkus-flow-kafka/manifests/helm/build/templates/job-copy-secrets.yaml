{{- $app := include "rhads-build.name" . -}}
{{- $vaultData := dict "component_id" $app -}}
{{- if .Values.maas -}}
{{- $_ := set $vaultData "MAAS_API_KEY" (.Values.maas.apiKey | default "") -}}
{{- $_ := set $vaultData "MAAS_BASE_URL" (.Values.maas.baseUrl | default "") -}}
{{- $_ := set $vaultData "MAAS_MODEL" (.Values.maas.model | default "") -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $app }}-copy-secrets
  annotations:
    # Regular Job (not PostSync): Argo waits for all resources Healthy before
    # PostSync. The build-cache PVC stays Pending until the first PipelineRun.
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 8
  template:
    spec:
      serviceAccountName: pipeline
      restartPolicy: OnFailure
      containers:
        - name: copy
          image: registry.redhat.io/openshift4/ose-cli:latest
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc:8200
            - name: VAULT_APP_DATA
              value: {{ $vaultData | toJson | quote }}
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail
              NS="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              APP="{{ $app }}"
              JWT="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
              echo "Writing application secrets to Vault at secret/apps/${APP}"
              LOGIN="$(curl -sS --request POST --data "{\"role\":\"app-seed\",\"jwt\":\"${JWT}\"}" \
                "${VAULT_ADDR}/v1/auth/kubernetes/login" || true)"
              VT="$(printf '%s' "$LOGIN" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p' | head -1)"
              if [ -z "$VT" ]; then
                echo "WARN: Vault kubernetes login failed; ESO sync may retry. ${LOGIN}" >&2
              else
                PUT="$(curl -sS -o /tmp/vault-put -w "%{http_code}" --header "X-Vault-Token: ${VT}" \
                  --request POST --data "{\"data\":${VAULT_APP_DATA}}" \
                  "${VAULT_ADDR}/v1/secret/data/apps/${APP}" || true)"
                echo "Vault seed secret/apps/${APP} http=${PUT}"
              fi
              copy_obj() {
                local kind="$1" name="$2" dest="${3:-$NS}"
                oc -n rhads-ci get "$kind" "$name" -o jsonpath='{.metadata.name}' >/dev/null 2>&1 || return 0
                oc extract "$kind/$name" --to="/tmp/${kind}-${name}" -n rhads-ci --confirm >/dev/null
                if [ "$kind" = secret ]; then
                  TYPE="$(oc get secret "$name" -n rhads-ci -o jsonpath='{.type}')"
                  oc create secret generic "$name" -n "$dest" --type="$TYPE" \
                    --from-file="/tmp/${kind}-${name}" --dry-run=client -o yaml | oc apply -f -
                else
                  oc create configmap "$name" -n "$dest" \
                    --from-file="/tmp/${kind}-${name}" --dry-run=client -o yaml | oc apply -f -
                fi
              }
              wait_or_copy_secret() {
                local name="$1" dest="${2:-$NS}"
                local i
                for i in $(seq 1 24); do
                  if oc -n "$dest" get secret "$name" >/dev/null 2>&1; then
                    echo "ESO synced secret ${name} in ${dest}"
                    return 0
                  fi
                  sleep 5
                done
                echo "ESO did not sync ${name} in ${dest}; copying from rhads-ci"
                copy_obj secret "$name" "$dest"
              }
              copy_quay_pull() {
                local dest="$1" sa="$2"
                oc get ns "$dest" >/dev/null 2>&1 || return 0
                wait_or_copy_secret quay-dockerconfig "$dest"
                oc -n "$dest" secrets link "$sa" quay-dockerconfig --for=pull 2>/dev/null || true
              }
              for s in cosign-signing-key acs-ci tpa-oidc rhads-pipeline-env quay-dockerconfig gitlab-token; do
                wait_or_copy_secret "$s"
              done
              copy_obj configmap rhads-conforma-policy || true
              copy_obj configmap rhads-maven-settings || true
              oc -n "$NS" secrets link pipeline quay-dockerconfig --for=pull,mount 2>/dev/null || true
              copy_quay_pull "${APP}-staging" "${APP}-staging"
              copy_quay_pull "${APP}-prod" "${APP}-prod"
              QUAY="https://{{ .Values.image.host }}"
              ORG="{{ .Values.image.organization | default "rhads" }}"
              REPO="{{ $app }}"
              PASS="{{ .Values.image.password }}"
              csrf() { curl -skc /tmp/quay.cj -sb /tmp/quay.cj "${QUAY}/csrf_token" | sed -n 's/.*"csrf_token":"\([^"]*\)".*/\1/p'; }
              TOKEN="$(csrf)"
              curl -skc /tmp/quay.cj -sb /tmp/quay.cj -o /tmp/quay-signin -w "%{http_code}" \
                -X POST "${QUAY}/api/v1/signin" \
                -H "X-CSRF-Token: ${TOKEN}" -H "Content-Type: application/json" \
                -H "X-Requested-With: XMLHttpRequest" \
                -d "{\"username\":\"quayadmin\",\"password\":\"${PASS}\"}" >/tmp/quay-signin-code
              TOKEN="$(csrf)"
              curl -sk -b /tmp/quay.cj -o /tmp/quay-create -w "%{http_code}" \
                -X POST "${QUAY}/api/v1/repository" \
                -H "X-CSRF-Token: ${TOKEN}" -H "Content-Type: application/json" \
                -H "X-Requested-With: XMLHttpRequest" \
                -d "{\"repo_kind\":\"image\",\"namespace\":\"${ORG}\",\"repository\":\"${REPO}\",\"visibility\":\"public\"}" >/tmp/quay-create-code || true
              TOKEN="$(csrf)"
              curl -sk -b /tmp/quay.cj -o /tmp/quay-grant -w "%{http_code}" \
                -X PUT "${QUAY}/api/v1/repository/${ORG}/${REPO}/permissions/user/${ORG}+pipeline" \
                -H "X-CSRF-Token: ${TOKEN}" -H "Content-Type: application/json" \
                -H "X-Requested-With: XMLHttpRequest" \
                -d '{"role":"admin"}' >/tmp/quay-grant-code || true
              echo "Quay ensure ${ORG}/${REPO} create=$(cat /tmp/quay-create-code) grant=$(cat /tmp/quay-grant-code)"
