apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: quarkus-flow-kafka
  title: Agentic Trip Planner — Quarkus Flow/Kafka
  description: "Agentic trip planner on Red Hat build of Quarkus 3.33 with Quarkus Flow (community) + Kafka CloudEvents HITL, MaaS, and the same RHADS pipelines (Nexus, Builds, SBOM, cosign, ACS, Conforma) as other Quarkus templates."
  tags:
    - recommended
    - quarkus
    - java
    - agentic
    - flow
    - kafka
    - langchain4j
    - rhads
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Application
      required: [component_id, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: trip-quarkus
          ui:field: EntityNamePicker
          maxLength: 18
        group_id:
          title: Maven Group Id
          type: string
          default: com.tripplanner
        artifact_id:
          title: Maven Artifact Id
          type: string
          default: trip-planner
        description:
          title: Description
          type: string
          default: Agentic Trip Planner (Quarkus Flow + Kafka + MaaS)
        owner:
          title: Owner
          type: string
          default: developers
    - title: Red Hat MaaS
      required: [maas_base_url, maas_model]
      properties:
        maas_base_url:
          title: MaaS OpenAI-compatible base URL
          type: string
          default: https://maas-rhdp.apps.maas.redhatworkshops.io/v1/
        maas_model:
          title: Model id
          type: string
          default: qwen3-14b
        maas_api_key:
          title: MaaS API key (also used in Dev Spaces)
          type: string
          ui:field: Secret
          description: From OpenShift AI → Gen AI studio → API keys. You can leave this empty and set MAAS_API_KEY in .env inside Dev Spaces.
    - title: Image registry
      required: [image_registry]
      properties:
        image_registry:
          title: Image Registry
          type: string
          enum: [Quay]
          default: Quay
        image_host:
          title: Quay host
          type: string
          default: QUAY_HOST_PLACEHOLDER
        image_tag:
          title: Image tag
          type: string
          default: latest
    - title: GitLab
      required: [repo, gitlab_group]
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: GitLab host
              type: string
              description: Hostname only (no https://). The scaffolder matches this against RHDH integrations.gitlab.host.
              default: GITLAB_HOST_PLACEHOLDER
        gitlab_group:
          title: GitLab group
          type: string
          default: developers
  steps:
    - id: template
      name: Fetch source skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.component_id }}-dev
          group_id: ${{ parameters.group_id }}
          artifact_id: ${{ parameters.artifact_id }}
          owner: ${{ parameters.owner }}
          gitlab_group: ${{ parameters.gitlab_group }}
          host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          gitops_namespace: openshift-gitops
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          image_organization: rhads
          port: 8080
          maas_base_url: ${{ parameters.maas_base_url }}
          maas_model: ${{ parameters.maas_model }}
          maas_api_key: ${{ secrets.maas_api_key }}
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
    - id: publish
      name: Publish source to GitLab
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
        settings:
          auto_devops_enabled: false
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
    - id: template-gitops
      name: Generate GitOps (app of apps)
      action: fetch:template
      input:
        url: ./manifests
        values:
          component_id: ${{ parameters.component_id }}
          source_repository_gitops: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
          source_repository: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.component_id }}-dev
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: rhads
          image_password: backstage
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: openshift-gitops
          gitops_project: default
          port: 8080
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          repository_host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          dockerfile: ./src/main/docker/Dockerfile.jvm
          build_language: maven
          maas_base_url: ${{ parameters.maas_base_url }}
          maas_model: ${{ parameters.maas_model }}
          maas_api_key: ${{ secrets.maas_api_key }}
        targetPath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
    - id: publish-gitops
      name: Publish GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.owner }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
        settings:
          auto_devops_enabled: false
    - id: create-argocd
      name: Create Argo CD app-of-apps
      action: argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: openshift-gitops
        repoUrl: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
        path: argocd/
  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
