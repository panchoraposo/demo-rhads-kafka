apiVersion: perses.dev/v1alpha2
kind: PersesDashboard
metadata:
  name: {{ .Values.name }}-trip
  namespace: rhads-observability
  labels:
    app.kubernetes.io/part-of: rhads-demo
    app.kubernetes.io/name: {{ .Values.name }}
spec:
  config:
    display:
      name: Trip Planner — {{ .Values.name }}
      description: Kafka flow-in / flow-out and the {{ .Values.name }} dev workload
    duration: 15m
    refreshInterval: 30s
    panels:
      kafka_up:
        kind: Panel
        spec:
          display:
            name: Kafka broker pods ready
          plugin:
            kind: StatChart
            spec:
              calculation: last-number
              format:
                unit: decimal
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: {{ .Values.datasource }}
                    query: sum(kube_pod_status_ready{namespace="kafka",condition="true",pod=~"rhads-kafka-dual-role-.*"})
      topic_messages:
        kind: Panel
        spec:
          display:
            name: flow-in / flow-out offset rate
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: {{ .Values.datasource }}
                    query: sum by (topic) (rate(kafka_topic_partition_current_offset{topic=~"flow-in|flow-out"}[5m]))
      app_cpu:
        kind: Panel
        spec:
          display:
            name: {{ .Values.name }} CPU
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: {{ .Values.datasource }}
                    query: sum by (pod) (rate(container_cpu_usage_seconds_total{namespace="{{ .Values.namespace }}",container!="",container!="POD"}[5m]))
      http_bytes:
        kind: Panel
        spec:
          display:
            name: HTTP bytes written
          plugin:
            kind: TimeSeriesChart
            spec: {}
          queries:
            - kind: TimeSeriesQuery
              spec:
                plugin:
                  kind: PrometheusTimeSeriesQuery
                  spec:
                    datasource:
                      kind: PrometheusDatasource
                      name: {{ .Values.datasource }}
                    query: sum(rate(http_server_bytes_written_count{namespace="{{ .Values.namespace }}"}[5m])) or sum(rate(http_requests_total{namespace="{{ .Values.namespace }}"}[5m]))
    layouts:
      - kind: Grid
        spec:
          display:
            title: {{ .Values.name }}
          items:
            - x: 0
              y: 0
              width: 6
              height: 4
              content:
                $ref: "#/spec/panels/kafka_up"
            - x: 6
              y: 0
              width: 18
              height: 8
              content:
                $ref: "#/spec/panels/topic_messages"
            - x: 0
              y: 8
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/app_cpu"
            - x: 12
              y: 8
              width: 12
              height: 8
              content:
                $ref: "#/spec/panels/http_bytes"
