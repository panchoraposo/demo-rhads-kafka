# Order Desk. Environment variables override these keys.
# Dev Spaces reads this file. The cluster Deployment injects DATABASE_* and KAFKA_*.

port=${{values.port}}
kafka.bootstrap.servers=${{values.kafka_bootstrap}}
kafka.topic=${{values.kafka_topic}}
apicurio.registry.url=http://rhads-registry-service.apicurio.svc:8080
component.id=${{values.component_id}}
web.root=web

database.host=${{values.component_id}}-postgres.${{values.namespace}}.svc
database.port=5432
database.user=orders
database.password=backstage
database.name=orders
database.sslmode=disable

local.cdc.fanout=false
