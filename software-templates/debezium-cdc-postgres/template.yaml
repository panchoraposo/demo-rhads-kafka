apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: debezium-cdc-postgres
  title: CDC — Debezium PostgreSQL
  description: "Change Data Capture with Red Hat build of Debezium + PostgreSQL. Shared KafkaConnect (rhads-debezium), Apicurio schema registry, Go consumer UI, Vault/ESO secrets. Community Go modules + Debian bases for RHDA/ACS CVEs; switch to Dockerfile.ubi to compare."
  tags:
    - cdc
    - debezium
    - kafka
    - postgres
    - go
    - rhads
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Application
      required: [component_id, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: orders-cdc
          ui:field: EntityNamePicker
          maxLength: 18
        description:
          title: Description
          type: string
          default: CDC — Debezium PostgreSQL (orders → Kafka → UI)
        owner:
          title: Owner
          type: string
          default: developers
    - title: Image registry
      required: [image_registry]
      properties:
        image_registry:
          title: Image Registry
          type: string
          enum: [Quay]
          default: Quay
        image_host:
          title: Quay host
          type: string
          default: QUAY_HOST_PLACEHOLDER
        image_tag:
          title: Image tag
          type: string
          default: latest
    - title: GitLab
      required: [repo, gitlab_group]
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: GitLab host
              type: string
              description: Hostname only (no https://).
              default: GITLAB_HOST_PLACEHOLDER
        gitlab_group:
          title: GitLab group
          type: string
          default: developers
  steps:
    - id: template
      name: Fetch source skeleton
      action: fetch:template
      input:
        url: ./skeleton
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.component_id }}-dev
          owner: ${{ parameters.owner }}
          module_path: github.com/rhads/${{ parameters.component_id }}
          gitlab_group: ${{ parameters.gitlab_group }}
          host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          gitops_namespace: openshift-gitops
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          image_organization: rhads
          port: 8080
          apicurio_url: https://apicurio.CLUSTER_SUBDOMAIN_PLACEHOLDER
          kafka_bootstrap: rhads-kafka-kafka-bootstrap.kafka.svc:9092
          kafka_topic: ${{ parameters.component_id }}.public.orders
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
    - id: publish
      name: Publish source to GitLab
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
        settings:
          auto_devops_enabled: false
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
    - id: template-gitops
      name: Generate GitOps (app of apps)
      action: fetch:template
      input:
        url: ./manifests
        values:
          component_id: ${{ parameters.component_id }}
          source_repository_gitops: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
          source_repository: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.component_id }}-dev
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: rhads
          image_password: backstage
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: openshift-gitops
          gitops_project: default
          port: 8080
          cluster_subdomain: CLUSTER_SUBDOMAIN_PLACEHOLDER
          repository_host: ${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}
          dockerfile: ./Dockerfile
          build_language: go
          apicurio_url: https://apicurio.CLUSTER_SUBDOMAIN_PLACEHOLDER
          kafka_bootstrap: rhads-kafka-kafka-bootstrap.kafka.svc:9092
          db_password: backstage
        targetPath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
    - id: publish-gitops
      name: Publish GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}?owner=${{ parameters.owner }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
        settings:
          auto_devops_enabled: false
    - id: create-argocd
      name: Create Argo CD app-of-apps
      action: backstage-community-argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: openshift-gitops
        repoUrl: https://${{ parameters.repo.host | replace('https://', '') | replace('http://', '') }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
        path: argocd/
  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
