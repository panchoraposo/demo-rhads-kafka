apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quarkus-template.name" . }}
  labels:
    {{- include "quarkus-template.labels" . | nindent 4 }}
spec:
  strategy:
    type: Recreate
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "quarkus-template.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        rhads.demo/image-tag: {{ .Values.image.tag | default "unknown" | quote }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "quarkus-template.selectorLabels" . | nindent 8 }}
        {{- include "backstage.labels" . | nindent 8 }}
        app.openshift.io/runtime: {{ .Values.runtime | default "go" }}
    spec:
      serviceAccountName: {{ include "quarkus-template.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Values.runtime | default "go" }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "quarkus-template.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrapServers | default "rhads-kafka-kafka-bootstrap.kafka.svc:9092" | quote }}
            - name: KAFKA_TOPIC
              value: {{ .Values.kafka.topic | quote }}
            - name: APICURIO_REGISTRY_URL
              value: {{ .Values.apicurio.url | default "http://rhads-registry-service.apicurio.svc:8080" | quote }}
            - name: WEB_ROOT
              value: /web
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: COMPONENT_ID
              value: {{ include "quarkus-template.name" . | quote }}
            {{- if .Values.db.enabled }}
            - name: DATABASE_HOST
              value: {{ .Values.db.host | default (printf "%s-postgres" (include "quarkus-template.name" .)) | quote }}
            - name: DATABASE_PORT
              value: {{ .Values.db.port | default "5432" | quote }}
            - name: DATABASE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName | default (printf "%s-db-credentials" (include "quarkus-template.name" .)) }}
                  key: POSTGRES_USER
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName | default (printf "%s-db-credentials" (include "quarkus-template.name" .)) }}
                  key: POSTGRES_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.secretName | default (printf "%s-db-credentials" (include "quarkus-template.name" .)) }}
                  key: POSTGRES_DB
            - name: DATABASE_SSLMODE
              value: disable
            {{- end }}
            {{- if .Values.localCdcFanout }}
            - name: LOCAL_CDC_FANOUT
              value: "true"
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 24
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
