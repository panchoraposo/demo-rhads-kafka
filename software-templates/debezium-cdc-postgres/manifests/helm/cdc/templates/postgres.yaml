apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.storage | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: rhads-demo
        app.kubernetes.io/component: postgres
        backstage.io/kubernetes-id: {{ include "cdc.name" . }}
    spec:
      containers:
        - name: postgres
          image: docker.io/library/postgres:16
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - wal_level=logical
            - -c
            - max_wal_senders=10
            - -c
            - max_replication_slots=10
            - -c
            - max_connections=100
          envFrom:
            - secretRef:
                name: {{ include "cdc.name" . }}-db-credentials
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cdc.name" . }}-postgres
        - name: init
          configMap:
            name: {{ include "cdc.name" . }}-postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
