apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.db.storage | default "5Gi" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: rhads-demo
        app.kubernetes.io/component: postgres
        backstage.io/kubernetes-id: {{ include "cdc.name" . }}
    spec:
      containers:
        - name: postgres
          # Official docker.io/library/postgres cannot chmod PGDATA under OpenShift restricted-v2.
          image: registry.redhat.io/rhel9/postgresql-16:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "cdc.name" . }}-db-credentials
                  key: POSTGRES_USER
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cdc.name" . }}-db-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "cdc.name" . }}-db-credentials
                  key: POSTGRES_DB
            - name: POSTGRESQL_MAX_CONNECTIONS
              value: "100"
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
            - name: init
              mountPath: /opt/app-root/src/postgresql-start
            - name: cfg
              mountPath: /opt/app-root/src/postgresql-cfg
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.db.user }}", "-d", "{{ .Values.db.name }}"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "cdc.name" . }}-postgres
        - name: init
          configMap:
            name: {{ include "cdc.name" . }}-postgres-init
            defaultMode: 0755
            items:
              - key: 01-orders.sh
                path: 01-orders.sh
        - name: cfg
          configMap:
            name: {{ include "cdc.name" . }}-postgres-init
            items:
              - key: cdc.conf
                path: cdc.conf
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cdc.name" . }}-postgres
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "cdc.name" . }}-postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
