# SA used by PostSync Jobs to apply KafkaConnector into the shared debezium NS
# and register schemas in Apicurio (cluster-scoped binding below).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cdc.name" . }}-cdc
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cdc.name" . }}-debezium-connector
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rhads-debezium-connector
subjects:
  - kind: ServiceAccount
    name: {{ include "cdc.name" . }}-cdc
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "cdc.name" . }}-cdc
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [endpoints, pods, services, secrets, configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "cdc.name" . }}-cdc
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "cdc.name" . }}-cdc
subjects:
  - kind: ServiceAccount
    name: {{ include "cdc.name" . }}-cdc
    namespace: {{ .Release.Namespace }}
