apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdc.name" . }}-postgres-init
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
data:
  cdc.conf: |
    wal_level = logical
    max_wal_senders = 10
    max_replication_slots = 10
  01-orders.sh: |
    # Sourced from postgresql-start (after create_users). Init would run too early.
    psql -v ON_ERROR_STOP=1 --dbname "{{ .Values.db.name }}" <<'SQL'
    CREATE TABLE IF NOT EXISTS public.orders (
      id       SERIAL PRIMARY KEY,
      customer TEXT NOT NULL,
      amount   NUMERIC(12, 2) NOT NULL,
      status   TEXT NOT NULL DEFAULT 'new'
    );
    ALTER ROLE {{ .Values.db.user }} WITH REPLICATION;
    ALTER TABLE public.orders OWNER TO {{ .Values.db.user }};
    -- FULL puts the previous row in UPDATE and DELETE events (before).
    ALTER TABLE public.orders REPLICA IDENTITY FULL;
    GRANT ALL ON SCHEMA public TO {{ .Values.db.user }};
    GRANT ALL ON SEQUENCE public.orders_id_seq TO {{ .Values.db.user }};
    DO $$
    BEGIN
      IF NOT EXISTS (SELECT 1 FROM pg_publication WHERE pubname = '{{ .Values.connector.publicationName }}') THEN
        CREATE PUBLICATION {{ .Values.connector.publicationName }} FOR TABLE public.orders;
      END IF;
    END
    $$;
    SQL
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cdc.name" . }}-order-change-avsc
  labels:
    {{- include "cdc.labels" . | nindent 4 }}
data:
  order-change.avsc: |
    {
      "type": "record",
      "name": "OrderChange",
      "namespace": "com.rhads.cdc",
      "doc": "Canonical order change event after Debezium CDC (demo).",
      "fields": [
        { "name": "id", "type": "long" },
        { "name": "customer", "type": "string" },
        { "name": "amount", "type": "double" },
        { "name": "status", "type": "string" },
        { "name": "op", "type": "string", "doc": "c|u|d|r from Debezium" },
        { "name": "ts_ms", "type": ["null", "long"], "default": null }
      ]
    }
