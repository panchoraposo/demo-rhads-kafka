---
# Prefer an existing rhads-ci token so idempotent reinstalls skip gitlab-rails.
- name: Probe existing gitlab-token secret
  ansible.builtin.command:
    cmd: oc --context {{ oc_context }} -n rhads-ci extract secret/gitlab-token --to=- --keys=token
  register: existing_gitlab_pat
  changed_when: false
  failed_when: false
  no_log: true

- name: Validate existing GitLab PAT
  when: existing_gitlab_pat.rc == 0 and (existing_gitlab_pat.stdout | default('') | trim | length) > 20
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/user"
    method: GET
    headers:
      PRIVATE-TOKEN: "{{ existing_gitlab_pat.stdout | trim }}"
    validate_certs: "{{ validate_ssl_certs | default(false) }}"
    status_code: [200]
  register: existing_gitlab_pat_check
  failed_when: false
  no_log: true

- name: Reuse existing GitLab PAT
  when: existing_gitlab_pat_check.status | default(0) == 200
  ansible.builtin.set_fact:
    gitlab_pat: "{{ existing_gitlab_pat.stdout | trim }}"
  no_log: true

- name: Create root PAT via gitlab-rails (GitLab 19 disables password-grant OAuth)
  when: gitlab_pat is not defined
  ansible.builtin.shell: |
    set -euo pipefail
    oc --context {{ oc_context }} -n {{ gitlab_namespace }} exec deploy/gitlab -c gitlab -- \
      gitlab-rails runner "user = User.find_by_username('root'); raise 'root missing' unless user; token = user.personal_access_tokens.create!(name: 'rhads-{{ lookup('pipe', 'date +%s') }}', scopes: ['api','read_api','read_repository','write_repository','sudo'], expires_at: 330.days.from_now); puts token.token"
  args:
    executable: /bin/bash
  register: rails_pat
  retries: 12
  delay: 20
  until: rails_pat.rc == 0 and (rails_pat.stdout_lines | last | default('') | length) > 20
  changed_when: true

- name: Capture PAT
  when: gitlab_pat is not defined
  ansible.builtin.set_fact:
    gitlab_pat: "{{ rails_pat.stdout_lines | last | trim }}"
  no_log: true
