---
- name: Store GitLab token for pipelines
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-token
        namespace: rhads-ci
      type: Opaque
      stringData:
        token: "{{ gitlab_pat }}"

- name: Disable default branch protection
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/application/settings"
    method: PUT
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    body_format: json
    body:
      default_branch_protection: 0
      auto_devops_enabled: false
    status_code: [200, 400]
    validate_certs: "{{ validate_ssl_certs }}"

- name: Create Dev Spaces OAuth application
  ansible.builtin.uri:
    url: "https://{{ gitlab_host }}/api/v4/applications"
    method: POST
    headers:
      PRIVATE-TOKEN: "{{ gitlab_pat }}"
    body_format: json
    body:
      name: OpenShift Dev Spaces
      redirect_uri: "https://devspaces.{{ openshift_base_domain }}/api/oauth/callback"
      scopes: "api read_user read_repository write_repository openid profile email"
      confidential: true
    status_code: [201, 400]
    validate_certs: "{{ validate_ssl_certs }}"
  register: gitlab_oauth_app

- name: Create gitlab-oauth-config secret for Dev Spaces
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: gitlab-oauth-config
        namespace: "{{ devspaces_namespace }}"
        labels:
          app.kubernetes.io/component: oauth-scm-configuration
          app.kubernetes.io/part-of: che.eclipse.org
        annotations:
          che.eclipse.org/oauth-scm-server: gitlab
          che.eclipse.org/scm-server-endpoint: "https://{{ gitlab_host }}"
      type: Opaque
      stringData:
        id: "{{ gitlab_oauth_app.json.application_id | default('missing') }}"
        secret: "{{ gitlab_oauth_app.json.secret | default('missing') }}"
  when: gitlab_oauth_app.status == 201
