---
- name: Read backstage service-account user
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/clients/{{ client_info.json[0].id }}/service-account-user"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_token }}"
    validate_certs: false
  register: backstage_sa_user

- name: Lookup realm-management client
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/clients?clientId=realm-management"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_token }}"
    validate_certs: false
  register: realm_mgmt_client

- name: Read realm-management roles
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/clients/{{ realm_mgmt_client.json[0].id }}/roles"
    method: GET
    headers:
      Authorization: "Bearer {{ kc_token }}"
    validate_certs: false
  register: realm_mgmt_roles

- name: Grant Keycloak org-sync roles to the backstage service account
  ansible.builtin.uri:
    url: "https://{{ keycloak_hostname }}/admin/realms/{{ keycloak_realm }}/users/{{ backstage_sa_user.json.id }}/role-mappings/clients/{{ realm_mgmt_client.json[0].id }}"
    method: POST
    headers:
      Authorization: "Bearer {{ kc_token }}"
    body: "{{ realm_mgmt_roles.json | selectattr('name', 'in', sa_role_names) | list }}"
    body_format: json
    status_code: [204, 409]
    validate_certs: false
  vars:
    sa_role_names:
      - view-realm
      - view-users
      - query-users
      - view-groups
      - query-groups
      - view-clients
      - query-clients
