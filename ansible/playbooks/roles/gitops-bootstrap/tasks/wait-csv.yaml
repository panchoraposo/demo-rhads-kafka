---
# Subscriptions are small. A namespace CSV list also returns every copied
# operator CSV (the CRD bundle) and takes 10–70s per call, so a fresh install
# spends many minutes just polling operators that are already Succeeded.
- name: "Wait for CSV matching '{{ csv.match }}' in {{ csv.ns }}"
  ansible.builtin.shell: |
    set -euo pipefail
    subs=$(oc --context "{{ oc_context }}" -n "{{ csv.ns }}" get sub \
      -o 'jsonpath={range .items[*]}{.status.currentCSV}{"\n"}{end}' 2>/dev/null || true)
    match="{{ csv.match }}"
    while IFS= read -r name; do
      [ -n "${name}" ] || continue
      case "${name}" in
        *"${match}"*)
          phase=$(oc --context "{{ oc_context }}" -n "{{ csv.ns }}" get csv "${name}" \
            -o jsonpath='{.status.phase}' 2>/dev/null || true)
          if [ "${phase}" = Succeeded ]; then
            printf '%s\n' "${name}"
            exit 0
          fi
          ;;
      esac
    done <<< "${subs}"
    exit 1
  args:
    executable: /bin/bash
  register: csv_out
  changed_when: false
  failed_when: false
  until: csv_out.rc == 0
  retries: 40
  delay: 10
