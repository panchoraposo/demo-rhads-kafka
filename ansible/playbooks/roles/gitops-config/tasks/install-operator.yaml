---
- name: Create openshift-gitops-operator namespace
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    name: openshift-gitops-operator
    state: present

- name: Render OperatorGroup and Subscription manifest
  ansible.builtin.template:
    src: gitops-subscription.yaml.j2
    dest: "{{ output_file }}"

- name: Apply OperatorGroup and Subscription
  kubernetes.core.k8s:
    state: present
    src: "{{ output_file }}"

- name: Wait for GitOps Operator CSV to succeed
  ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/gitops-bootstrap/tasks/wait-csv.yaml"
  vars:
    csv:
      ns: openshift-gitops-operator
      match: gitops

- name: Wait for GitOps Operator Deployment to be ready
  ansible.builtin.command:
    argv:
      - oc
      - --context
      - "{{ oc_context }}"
      - -n
      - openshift-gitops-operator
      - get
      - deploy
      - openshift-gitops-operator-controller-manager
      - -o
      - jsonpath={.status.availableReplicas}
  register: deploy_status
  changed_when: false
  failed_when: false
  until: (deploy_status.stdout | default('0', true) | int) > 0
  retries: 30
  delay: 10

- name: Create openshift-gitops namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ gitops_namespace }}"

- name: Create ArgoCD instance
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: argoproj.io/v1alpha1
      kind: ArgoCD
      metadata:
        name: openshift-gitops
        namespace: "{{ gitops_namespace }}"
      spec:
        server:
          insecure: true
          route:
            enabled: true
        controller:
          resources:
            limits:
              memory: 4Gi
              cpu: "2"
            requests:
              memory: 1Gi
              cpu: 500m
        repo:
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 256Mi

- name: Wait for ArgoCD server deployment
  ansible.builtin.command:
    argv:
      - oc
      - --context
      - "{{ oc_context }}"
      - -n
      - "{{ gitops_namespace }}"
      - get
      - deploy
      - openshift-gitops-server
      - -o
      - jsonpath={.status.readyReplicas}
  register: deployment_status
  changed_when: false
  failed_when: false
  retries: 40
  delay: 15
  until: (deployment_status.stdout | default('0', true) | int) > 0

# OpenShift GitOps CRD drops unknown fields (spec.server.route.host). Create the
# short hostname Route used by RHDH / dashboard (argocd.apps.<cluster>).
- name: Create short Argo CD Route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: argocd
        namespace: "{{ gitops_namespace }}"
        labels:
          app.kubernetes.io/name: openshift-gitops-server
      spec:
        host: "{{ argocd_host }}"
        to:
          kind: Service
          name: openshift-gitops-server
          weight: 100
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect
        wildcardPolicy: None

- name: Grant cluster-admin to Argo CD application controller
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: openshift-gitops-argocd-application-controller-admin
      subjects:
        - kind: ServiceAccount
          name: "{{ argocd_controller_sa }}"
          namespace: "{{ gitops_namespace }}"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: cluster-admin
